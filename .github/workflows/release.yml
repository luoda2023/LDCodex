# LDCodex 自动发版（Windows x64 / NSIS）+ Tauri 自动更新的更新源。
#
# 触发：推一个与 [workspace.package] version 一致的 tag（形如 v88.8.6）
#   git tag v88.8.6 && git push origin v88.8.6
#
# 产出（全部挂在同一个 GitHub Release 上）：
#   LDCodex_<版本>_x64-setup.exe        NSIS 安装包
#   LDCodex_<版本>_x64-setup.exe.sig    minisign 签名（客户端下载后校验，缺它则更新装不上）
#   latest.json                          Tauri updater 的更新源
#
# 客户端读的地址（写死在 src-tauri/tauri.conf.json → plugins.updater.endpoints）：
#   https://github.com/luoda2023/LDCodex/releases/latest/download/latest.json
# 所以 latest.json 的**字段名不能改** —— 详见 tools/make-latest-json.mjs 的注释。
#
# ⚠️ 仓库 Secrets 必须先配好（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY            私钥全文（tauri signer generate 产出的 .key 内容）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   私钥口令；本项目密钥**无口令**，留空即可
# 公钥已硬编码在 tauri.conf.json 的 plugins.updater.pubkey，与私钥必须成对；
# 换密钥时两处要一起换，否则老客户端会全部校验失败。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（形如 v88.8.6）"
        required: true
        type: string

permissions:
  contents: write

env:
  APP_DIR: apps/codex-plus-manager
  BUNDLE_DIR: target/release/bundle/nsis

jobs:
  windows-release:
    name: Build & publish (Windows x64, signed)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # 版本号唯一权威来源是根 Cargo.toml 的 [workspace.package] version
      # （5 个 crate 通过 version.workspace = true 继承）。这里只读它，
      # 不去解析 package.json / tauri.conf.json，避免又造出第二个"权威"。
      - name: Read version from [workspace.package]
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -e '
            const fs = require("fs");
            const text = fs.readFileSync("Cargo.toml", "utf8");
            const section = text.split(/^\[/m).find((s) => s.startsWith("workspace.package]"));
            if (!section) { console.error("Cargo.toml 里找不到 [workspace.package]"); process.exit(1); }
            const m = section.match(/^\s*version\s*=\s*"([^"]+)"/m);
            if (!m) { console.error("[workspace.package] 里找不到 version"); process.exit(1); }
            process.stdout.write(m[1]);
          ')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "版本号：$VERSION"

      # 防呆：tag 与版本号不一致就停。否则会发出一个「安装包版本 ≠ 更新源版本」的 Release，
      # 客户端要么永远检测不到、要么检测到了却装不上（且都不会报错，只会表现为"没反应"）。
      - name: Assert tag matches the workspace version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag '$TAG' 与 Cargo.toml 的版本 '$VERSION' 不一致（应为 v$VERSION）"
            exit 1
          fi
          echo "tag 与版本号一致：$TAG"

      - name: Install frontend dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      # npm run build = 编译 codex-plus-launcher → stage 到 resources/ → tauri build
      # （tauri build 内部再跑 beforeBuildCommand：prepare workbuddy runtime + vite build + verify dist）
      - name: Build signed NSIS bundle
        working-directory: ${{ env.APP_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      - name: Assert the updater artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          SETUP="$BUNDLE_DIR/LDCodex_${VERSION}_x64-setup.exe"
          for f in "$SETUP" "$SETUP.sig"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少产物 $f"
              echo "  .sig 不存在 = 构建时没有 TAURI_SIGNING_PRIVATE_KEY，绝不能发这种 Release"
              ls -la "$BUNDLE_DIR" || true
              exit 1
            fi
            echo "✓ $f ($(wc -c < "$f") bytes)"
          done

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          SETUP_NAME="LDCodex_${VERSION}_x64-setup.exe"
          # 用 commit 标题当更新说明（单行，避免多行内容把 YAML/环境变量搞坏）。
          SUBJECT=$(git log -1 --pretty=%s)
          SETUP_NAME="$SETUP_NAME" \
          SIG_FILE="$BUNDLE_DIR/${SETUP_NAME}.sig" \
          REPO="${{ github.repository }}" \
          TAG="${{ github.event.inputs.tag || github.ref_name }}" \
          OUT="$BUNDLE_DIR/latest.json" \
          NOTES="$SUBJECT" \
          node tools/make-latest-json.mjs

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: LDCodex ${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/LDCodex_${{ steps.version.outputs.value }}_x64-setup.exe
            target/release/bundle/nsis/LDCodex_${{ steps.version.outputs.value }}_x64-setup.exe.sig
            target/release/bundle/nsis/latest.json
