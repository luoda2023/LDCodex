# ⚠️ 本文件已停用（2026-09-15）。保留只为留个记录，不再挂任何自动触发器。
#
# 它继承自上游 Codex++ 项目，与 LDCodex 这个 fork 已经对不上，继续跑有两个真问题：
#
#   1. 它构建的是 `codex-plus-plus.exe` / `codex-plus-plus-manager.exe`，
#      而本 fork 的实际产物是 `ldcodex.exe` / `LDCodexManager.exe` ——
#      那些 Copy-Item 必然失败，每次发版都会多出一片红的 CI。
#
#   2. 更要命的是它的 `latest-json` 任务会往 Release 里传一份**自定义格式**的 latest.json：
#        { "version": "v88.8.6", "url": ..., "body": ..., "assets": [...] }
#      而 Tauri updater 要的是官方格式：
#        { "version": "88.8.6", "platforms": { "windows-x86_64": { "signature": ..., "url": ... } } }
#      一旦这份覆盖掉正确的那份，客户端自动更新会**静默失效**：
#      `v` 前缀让 semver 解析失败、缺 `platforms` 则找不到可下载资产，而两者都不会报错，
#      用户侧只表现为「一直显示已是最新版本」。
#
# 自动更新改由 `.github/workflows/release.yml` 负责（tag 触发 → 签名构建 → 传
# 安装包 + .sig + Tauri 格式 latest.json）。确认无人引用后可以直接删除本文件。

name: Release assets (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: 本工作流已停用
        run: |
          echo "::warning::release-assets.yml 已停用；Windows 签名发版请用 .github/workflows/release.yml（推 v* tag 触发）"
          exit 1
