[workspace]
resolver = "2"
members = [
  "crates/codex-plus-core",
  "crates/codex-plus-data",
  "apps/codex-plus-launcher",
  "apps/codex-plus-manager/src-tauri",
]

[workspace.package]
# 统一版本号（唯一权威来源）：所有 Rust crate 通过 `version.workspace = true` 继承此值。
# 版本基线 88.8.4，以后每升级一次加 1（88.8.5、88.8.6 ……）。
# 必须与以下文件保持一致：apps/codex-plus-manager/package.json、
# src-tauri/tauri.conf.json、src-tauri/workbuddy-runtime/package.json、
# src-tauri/workbuddy-runtime/daemon.js（DAEMON_VERSION / DAEMON_BUILD_ID）。
version = "88.8.5"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/luoda2023/LDCodex"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "system-proxy"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
toml_edit = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"

# 构建内存约束（本机 8GB 物理 / 固定页面文件，提交上限约 15GB）。
#
# release 下编译 `codex-plus-manager` 这个巨型 crate（Tauri + windows 生成绑定，
# 且 crate-type 同时含 staticlib/cdylib/rlib）时，LLVM 会因提交内存不足直接
# `rustc-LLVM ERROR: out of memory`（退出码 0xC0000409）。这里只对该包把
# codegen-units 提高，使单个 LLVM 模块更小、峰值内存更低 —— 不改 opt-level，
# 优化级别与其它 crate 保持一致；后续机器内存宽裕时可直接删掉本段。
[profile.release.package.codex-plus-manager]
codegen-units = 32
